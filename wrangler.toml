name = "cloudflare_cable"
main = "src/index.ts"
# Compatibility date for Durable Objects SQLite and newer runtime APIs.
# Pending DO alarms must be deleted explicitly using deleteAlarm().
compatibility_date = "2026-05-26"

routes = [
  { pattern = "cable.yourdomain.com", custom_domain = true } 
]

[[durable_objects.bindings]]
name = "TUNNEL_ROOM"
class_name = "TunnelRoom"

[[migrations]]
tag = "v2"
# Enable SQLite storage backend support to significantly boost sync and R/W performance
new_sqlite_classes = ["TunnelRoom"]

[observability]
enabled = false
head_sampling_rate = 0.1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false

[vars]
RECONNECT_GRACE_MS = "30000"
